[package]
name = "blank"
version = "0.1.0"
description = "A lightweight desktop text editor"
authors = ["blank"]
edition = "2021"

[lib]
name = "blank_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
dunce = "1"
uuid = { version = "1", features = ["v4"] }
